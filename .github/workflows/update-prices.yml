name: BIST fiyat ve temettü verilerini güncelle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'update_prices.py'
      - 'update_dividends.py'
      - '.github/workflows/update-prices.yml'
  schedule:
    - cron: '*/15 5-16 * * 1-5'

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4
      - name: Fiyatları çek
        run: python update_prices.py
      - name: Temettü takvimini çek
        run: python update_dividends.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "bist-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json dividends.json
          if git diff --cached --quiet; then
            echo "Yeni veri değişikliği yok"
          else
            git commit -m "BIST piyasa verilerini güncelle"
            git push
          fi
