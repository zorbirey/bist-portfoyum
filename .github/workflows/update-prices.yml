name: BIST fiyatlarını güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 5-16 * * 1-5'

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bağımlılıkları kur
        run: pip install requests beautifulsoup4
      - name: Fiyatları çek
        run: python update_prices.py
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "bist-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "Yeni fiyat değişikliği yok"
          else
            git commit -m "BIST fiyatlarını güncelle"
            git push
          fi
