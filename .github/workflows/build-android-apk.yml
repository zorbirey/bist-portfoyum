name: Android APK Olustur

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: FFmpeg kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Gercek ikon ve Zeus gorsellerini hazirla
        run: |
          set -e
          mkdir -p android-wrapper/app/src/main/res/drawable-nodpi
          rm -f android-wrapper/app/src/main/res/drawable/zeus_splash.xml
          python3 - <<'PY'
          from pathlib import Path
          import base64

          pairs = [
              (Path('android-wrapper/assets-b64/app_icon.b64'), Path('android-wrapper/app/src/main/res/drawable-nodpi/app_icon.webp')),
              (Path('android-wrapper/assets-b64/zeus_splash.b64'), Path('android-wrapper/app/src/main/res/drawable-nodpi/zeus_splash.webp')),
          ]

          for src, dst in pairs:
              text = ''.join(src.read_text(encoding='utf-8').split())
              data = base64.b64decode(text, validate=True)
              if not data.startswith(b'RIFF') or b'WEBP' not in data[:16]:
                  raise RuntimeError(f'{src} geçerli WebP değil')
              dst.write_bytes(data)
              print(f'{dst}: {len(data)} byte WebP hazır')
          PY

          # Zeus kompozisyonunu yaklaşık %12 büyüt; ekranı daha dolu kullanır.
          ffmpeg -loglevel error -y \
            -i android-wrapper/app/src/main/res/drawable-nodpi/zeus_splash.webp \
            -vf "scale=358:980,crop=320:875" \
            -frames:v 1 android-wrapper/app/src/main/res/drawable-nodpi/zeus_splash_large.webp
          mv android-wrapper/app/src/main/res/drawable-nodpi/zeus_splash_large.webp \
             android-wrapper/app/src/main/res/drawable-nodpi/zeus_splash.webp

          file android-wrapper/app/src/main/res/drawable-nodpi/app_icon.webp
          file android-wrapper/app/src/main/res/drawable-nodpi/zeus_splash.webp

      - name: Gradle kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Debug APK olustur
        working-directory: android-wrapper
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BIST-Portfoy-Android-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
