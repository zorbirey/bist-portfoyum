name: Android APK Olustur

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Gradle kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Debug APK olustur
        working-directory: android-wrapper
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BIST-Portfoy-Android-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
