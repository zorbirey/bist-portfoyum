name: Android APK Olustur

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-wrapper/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Gercek ikon ve Zeus gorsellerini hazirla
        run: |
          set -e
          mkdir -p android-wrapper/app/src/main/res/drawable-nodpi
          rm -f android-wrapper/app/src/main/res/drawable/zeus_splash.xml

          tr -cd 'A-Za-z0-9+/=' < android-wrapper/assets-b64/app_icon.b64 | base64 -d > android-wrapper/app/src/main/res/drawable-nodpi/app_icon.webp
          tr -cd 'A-Za-z0-9+/=' < android-wrapper/assets-b64/zeus_splash.b64 | base64 -d > android-wrapper/app/src/main/res/drawable-nodpi/zeus_splash.webp

          test -s android-wrapper/app/src/main/res/drawable-nodpi/app_icon.webp
          test -s android-wrapper/app/src/main/res/drawable-nodpi/zeus_splash.webp
          file android-wrapper/app/src/main/res/drawable-nodpi/app_icon.webp
          file android-wrapper/app/src/main/res/drawable-nodpi/zeus_splash.webp
      - name: Gradle kur
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Debug APK olustur
        working-directory: android-wrapper
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BIST-Portfoy-Android-APK
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
