<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>LGS Arena Temiz Sıfırlama</title>
<style>
html,body{margin:0;min-height:100%;background:#020710;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center;min-height:100dvh;padding:20px}.card{width:min(92vw,420px);padding:24px;border:1px solid #397dff66;border-radius:22px;background:linear-gradient(145deg,#0a223d,#051222);box-shadow:0 24px 70px #000a;text-align:center}.bolt{font-size:44px}.kicker{display:block;color:#f2bd58;font-size:10px;font-weight:900;letter-spacing:2px}.card h1{font:800 26px Georgia,serif;margin:10px 0}.card p{color:#a9bfd4;font-size:12px;line-height:1.5}.status{margin:14px 0;padding:11px;border-radius:12px;background:#031020;color:#cfe1f4;font-size:11px;line-height:1.45;text-align:left}.bar{height:7px;border-radius:99px;background:#06182b;overflow:hidden;margin:10px 0 16px}.bar i{display:block;height:100%;width:8%;background:linear-gradient(90deg,#1768ff,#34bff2);transition:width .25s ease}button{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(90deg,#1768ff,#34bff2);color:#fff;font-weight:900}small{display:block;margin-top:12px;color:#718ba5;font-size:9px;line-height:1.4}
</style>
</head>
<body>
<section class="card">
<div class="bolt">⚡</div><span class="kicker">LGS 2027 ARENA</span><h1>Temiz PWA Sıfırlama</h1>
<p>Bu sayfa LGS uygulamasının service worker kapsamının dışındadır. Öğrenci ilerlemesini silmeden eski LGS worker ve cache kayıtlarını kaldırır.</p>
<div id="status" class="status">Hazırlanıyor…</div><div class="bar"><i id="bar"></i></div>
<button id="go" disabled>LGS ARENA'YI TEMİZ AÇ</button>
<small>localStorage temizlenmez. Soru geçmişi, XP ve öğrenci profili korunur.</small>
</section>
<script>
(function(){
'use strict';
var status=document.getElementById('status'),bar=document.getElementById('bar'),go=document.getElementById('go');
var target='https://zorbirey.github.io/LGS2027-Arena/?v=29&externalReset='+Date.now();
function set(t,p){status.textContent=t;bar.style.width=p+'%'}
async function reset(){
 try{
  set('1/4 · LGS service worker kayıtları aranıyor…',20);
  if('serviceWorker' in navigator){
   var regs=await navigator.serviceWorker.getRegistrations();
   var lgs=regs.filter(function(r){return String(r.scope||'').includes('/LGS2027-Arena/')||String(r.active&&r.active.scriptURL||'').includes('/LGS2027-Arena/')||String(r.waiting&&r.waiting.scriptURL||'').includes('/LGS2027-Arena/')||String(r.installing&&r.installing.scriptURL||'').includes('/LGS2027-Arena/')});
   await Promise.allSettled(lgs.map(function(r){return r.unregister()}));
   set('2/4 · '+lgs.length+' LGS service worker kaydı kaldırıldı.',45);
  }else set('2/4 · Service worker desteği yok, devam ediliyor.',45);
  var keys=await caches.keys();
  var lgsKeys=keys.filter(function(k){return /lgs-2027-arena/i.test(k)});
  await Promise.allSettled(lgsKeys.map(function(k){return caches.delete(k)}));
  set('3/4 · '+lgsKeys.length+' eski LGS cache paketi kaldırıldı.',70);
  try{await fetch('https://zorbirey.github.io/LGS2027-Arena/index.html?v=29&probe='+Date.now(),{cache:'reload',credentials:'same-origin'})}catch(e){}
  set('4/4 · Temizleme tamamlandı. LGS Arena artık eski worker tarafından tutulmuyor.',100);
  go.disabled=false;
 }catch(e){
  set('Temizleme sırasında hata oluştu: '+(e&&e.message?e.message:'bilinmeyen hata')+'. Butona basıp temiz açılışı yine deneyebilirsin.',100);go.disabled=false;
 }
}
go.onclick=function(){location.href=target};
reset();
})();
</script>
</body>
</html>
