<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dbe9e3"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BIST Portföy"><title>BIST Portföy</title><style>:root{--bg:#f5f7f5;--card:#fff;--ink:#26352f;--muted:#74817b;--green:#4f9d75;--red:#c96b6b;--accent:#dbe9e3;--line:#e6ebe8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Arial}.app{max-width:1050px;margin:auto;padding-bottom:90px}.top{padding:20px 16px 10px;display:flex;justify-content:space-between;align-items:center}.title{font-size:24px;font-weight:900}.sub,.small{font-size:12px;color:var(--muted)}button{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);font-weight:800;color:var(--ink)}.page{padding:8px 16px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.panel{margin-top:12px}.label{font-size:11px;color:var(--muted);font-weight:800}.value{font-size:21px;font-weight:900;margin-top:6px}.section{font-size:18px;font-weight:900;margin:18px 0 9px}.green{color:var(--green)}.red{color:var(--red)}.tabs{position:fixed;bottom:0;left:0;right:0;height:76px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);z-index:9}.tab{background:none;border-radius:0;padding:7px 2px;font-size:9px;color:var(--muted)}.tab.active{background:#f0f6f2;color:var(--green)}.ico{display:block;font-size:20px;margin-bottom:3px}.stock{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:10px;align-items:center}.ticker{font-size:17px;font-weight:900}.right{text-align:right}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fbfcfb}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.warning{padding:14px;border:2px solid #d76565;background:#fff1f1;color:#9d3030;border-radius:15px;text-align:center;font-weight:900;line-height:1.45;animation:pulse 1.15s infinite}.progress{height:18px;background:#f0dddd;border-radius:99px;overflow:hidden}.progress div{height:100%;background:#77b08e}.empty{text-align:center;padding:30px 12px;color:var(--muted)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.install{display:none;margin:0 16px 8px;padding:12px;background:#edf6f0;border-radius:14px}.install.show{display:flex;justify-content:space-between;align-items:center}@keyframes pulse{50%{opacity:.55}}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.stock{grid-template-columns:1.2fr 1fr}.stock .mobilehide{display:none}.formgrid{grid-template-columns:1fr}.value{font-size:18px}}</style></head><body><div class="app"><header class="top"><div><div class="title">BIST Portföy</div><div class="sub">Kişisel portföy ve net temettü takibi</div></div><button onclick="render()">↻</button></header><div id="install" class="install"><div><b>Uygulama olarak yükle</b><div class="small">Ana ekrandan bağımsız açılır</div></div><button id="installBtn">YÜKLE</button></div><main id="content"></main><nav class="tabs"><button class="tab active" data-p="portfolio" onclick="go('portfolio',this)"><span class="ico">⌂</span>PORTFÖY</button><button class="tab" data-p="distribution" onclick="go('distribution',this)"><span class="ico">◔</span>DAĞILIM</button><button class="tab" data-p="dividend" onclick="go('dividend',this)"><span class="ico">💵</span>TEMETTÜ</button><button class="tab" data-p="target" onclick="go('target',this)"><span class="ico">🎯</span>HEDEF</button><button class="tab" data-p="history" onclick="go('history',this)"><span class="ico">▣</span>GEÇMİŞ</button><button class="tab" data-p="settings" onclick="go('settings',this)"><span class="ico">⚙</span>AYARLAR</button></nav></div><script>const nf=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}),fmt=n=>nf.format(Number(n)||0);let page='portfolio';let stocks=JSON.parse(localStorage.getItem('stocks')||'[]');let annualTarget=Number(localStorage.getItem('annualTarget')||0);let monthlyTarget=Number(localStorage.getItem('monthlyTarget')||0);let dividends=JSON.parse(localStorage.getItem('dividends')||'[]');function save(){localStorage.setItem('stocks',JSON.stringify(stocks));localStorage.setItem('annualTarget',annualTarget);localStorage.setItem('monthlyTarget',monthlyTarget);localStorage.setItem('dividends',JSON.stringify(dividends))}function totals(){let cost=0,val=0;stocks.forEach(s=>{cost+=s.qty*s.cost;val+=s.qty*s.price});return{cost,val,pnl:val-cost}}function go(p,b){page=p;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');render()}function portfolio(){let t=totals();return `<div class="page"><div class="cards"><div class="card"><div class="label">TOPLAM PORTFÖY DEĞERİ</div><div class="value">${fmt(t.val)} ₺</div></div><div class="card"><div class="label">KÂR / ZARAR</div><div class="value ${t.pnl>=0?'green':'red'}">${fmt(t.pnl)} ₺</div></div><div class="card"><div class="label">MALİYET TUTARI</div><div class="value">${fmt(t.cost)} ₺</div></div><div class="card"><div class="label">GÜNLÜK KÂR / ZARAR</div><div class="value">—</div><div class="small">Veri bağlantısı bekleniyor</div></div></div><div class="section">Portföyüm</div>${stocks.length?stocks.map((s,i)=>{let v=s.qty*s.price,p=v-s.qty*s.cost;return `<div class="panel stock"><div><div class="ticker">${s.code}</div><div class="small">${s.name||''}</div><div class="small">${fmt(s.qty)} adet · Ort. maliyet ${fmt(s.cost)} ₺</div></div><div class="mobilehide"><div class="small">GÜNCEL FİYAT</div><b>${s.price?fmt(s.price)+' ₺':'Veri bekleniyor'}</b></div><div class="right"><div class="small">KÂR / ZARAR</div><b class="${p>=0?'green':'red'}">${s.price?fmt(p)+' ₺':'—'}</b></div></div>`}).join(''):`<div class="panel empty"><b>Demo hisseler kaldırıldı.</b><br>AYARLAR bölümünden kendi hisselerini ekleyebilirsin.<br><span class="small">Güncel fiyat alanı gerçek BIST veri bağlantısı kurulana kadar boş bırakılabilir.</span></div>`}</div>`}function distribution(){let t=totals();return `<div class="page"><div class="section">Dağılım</div>${!stocks.length||!t.val?'<div class="panel empty">Dağılım göstermek için portföy ve güncel fiyat verisi gerekli.</div>':stocks.map(s=>{let v=s.qty*s.price,p=v/t.val*100;return `<div class="panel"><b>${s.code}</b><div class="small">%${fmt(p)} · ${fmt(v)} ₺</div><div class="progress"><div style="width:${p}%"></div></div></div>`}).join('')}</div>`}function divTotal(){return dividends.reduce((a,d)=>a+(Number(d.net)||0),0)}function dividend(){let total=divTotal();return `<div class="page"><div class="cards"><div class="card"><div class="label">YIL İÇİ NET ÖNGÖRÜ</div><div class="value">${fmt(total)} ₺</div></div><div class="card"><div class="label">ÖDENEN NET</div><div class="value">${fmt(dividends.filter(d=>d.paid).reduce((a,d)=>a+Number(d.net||0),0))} ₺</div></div><div class="card"><div class="label">HEDEFLENEN AYLIK</div><div class="value">${fmt(monthlyTarget)} ₺</div></div><div class="card"><div class="label">AYLIK HEDEF ORANI</div><div class="value">%${monthlyTarget?fmt((total/12)/monthlyTarget*100):'0,00'}</div></div></div><div class="section">Temettülerim</div><div class="panel empty">Demo temettü verileri kaldırıldı. Gerçek temettü veri kaynağı bağlandığında bu alan otomatik dolacak.</div></div>`}function cleanMoney(v){return Number(String(v).replace(/\./g,'').replace(',','.').replace(/[^0-9.]/g,''))||0}function moneyInput(v){return new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0}).format(v||0)}function target(){let actual=divTotal(),r=annualTarget?Math.min(100,actual/annualTarget*100):0;return `<div class="page"><div style="text-align:center"><div class="section red">NET TEMETTÜ HEDEFİ</div><b>HEDEFE GİDEN YOLDA ÇEKİLEN BÜTÜN ÇİLELER KUTSALDIR</b></div><div class="warning" style="margin-top:14px">UYARI<br>BU HESAPLAMALAR SADECE BU SENEYE GÖRE YAPILMIŞTIR. SENEYE HİSSESİNİN TEMETTÜ VERMESİ GARANTİ DEĞİLDİR. SADECE FİKİR AMAÇLIDIR</div><div class="panel"><div class="label">YILLIK NET TEMETTÜ HEDEFİ</div><input id="targetInput" inputmode="numeric" value="${moneyInput(annualTarget)}" oninput="formatTarget(this)" onblur="saveTarget(this)"><div class="small" style="margin-top:7px">Örnek: 60.000 veya 120.000</div></div><div class="panel"><div class="label">BU YIL ÖNGÖRÜLEN NET TEMETTÜ</div><div class="value">${fmt(actual)} ₺</div><div class="progress"><div style="width:${r}%"></div></div><div class="small" style="margin-top:8px">Hedefin %${fmt(r)} · Kalan ${fmt(Math.max(0,annualTarget-actual))} ₺</div></div></div>`}function formatTarget(el){let n=cleanMoney(el.value);el.value=moneyInput(n)}function saveTarget(el){annualTarget=cleanMoney(el.value);save();render()}function history(){return `<div class="page"><div class="section">Geçmiş</div><div class="panel empty">18:45 otomatik portföy geçmişi gerçek veri ve sunucu bağlantısı kurulduğunda burada tutulacak.</div></div>`}function settings(){return `<div class="page"><div class="section">Portföy Düzenle</div><div class="panel"><div class="formgrid"><input id="code" placeholder="BIST kodu (örn. TUPRS)"><input id="name" placeholder="Şirket adı"><input id="qty" inputmode="decimal" placeholder="Hisse adedi"><input id="cost" inputmode="decimal" placeholder="Ortalama maliyet"><input id="price" inputmode="decimal" placeholder="Güncel fiyat (şimdilik isteğe bağlı)"></div><div class="btnrow"><button onclick="addStock()">HİSSE EKLE</button></div></div>${stocks.map((s,i)=>`<div class="panel stock"><div><b>${s.code}</b><div class="small">${s.name||''} · ${fmt(s.qty)} adet</div></div><div class="right"><button onclick="removeStock(${i})">SİL</button></div></div>`).join('')}<div class="section">Hedef Ayarı</div><div class="panel"><div class="label">AYLIK NET TEMETTÜ HEDEFİ</div><input id="monthly" inputmode="numeric" value="${moneyInput(monthlyTarget)}" oninput="formatTarget(this)" onblur="monthlyTarget=cleanMoney(this.value);save()"></div><div class="panel"><b>Veri durumu</b><div class="small" style="margin-top:6px">Demo fiyatlar kaldırıldı. Girilen güncel fiyatlar cihazında saklanır. Sonraki adım gerçek gecikmeli BIST fiyat servisinin bağlanmasıdır.</div></div></div>`}function addStock(){if(stocks.length>=10)return alert('En fazla 10 hisse eklenebilir.');let code=document.getElementById('code').value.trim().toUpperCase();if(!code)return alert('BIST kodunu gir.');stocks.push({code,name:document.getElementById('name').value.trim(),qty:cleanMoney(document.getElementById('qty').value),cost:cleanMoney(document.getElementById('cost').value),price:cleanMoney(document.getElementById('price').value)});save();render()}function removeStock(i){stocks.splice(i,1);save();render()}function render(){document.getElementById('content').innerHTML={portfolio,distribution,dividend,target,history,settings}[page]()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');let dp=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;document.getElementById('install').classList.add('show')});document.getElementById('installBtn').onclick=async()=>{if(dp){dp.prompt();await dp.userChoice;dp=null;document.getElementById('install').classList.remove('show')}};</script></body></html>
