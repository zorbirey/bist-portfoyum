<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dbe9e3">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BIST Portföy">
<title>BIST Portföy</title>
<style>
:root{--bg:#f5f7f5;--card:#fff;--ink:#26352f;--muted:#74817b;--green:#4f9d75;--red:#c96b6b;--accent:#dbe9e3;--line:#e6ebe8;--shadow:0 8px 24px #32443a12}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
.app{max-width:1100px;margin:auto;min-height:100vh;padding-bottom:92px}.top{padding:20px 18px 10px;display:flex;justify-content:space-between;align-items:center}.title{font-size:25px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:4px}
button{border:0;border-radius:13px;padding:11px 15px;background:var(--accent);color:var(--ink);font-weight:700;cursor:pointer}.refresh{font-size:20px;width:44px;height:44px;padding:0}
.page{padding:8px 16px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.label{font-size:12px;color:var(--muted);font-weight:700}.value{font-size:22px;font-weight:800;margin-top:8px}.green{color:var(--green)}.red{color:var(--red)}.stocks{display:grid;gap:12px;margin-top:16px}.stock{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;align-items:center;gap:12px}.ticker{font-weight:900;font-size:17px}.company{font-size:12px;color:var(--muted);margin-top:3px}.small{font-size:12px;color:var(--muted)}.right{text-align:right}.section{font-size:18px;font-weight:800;margin:20px 2px 10px}
.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);height:76px;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 25px #32443a0b}.tab{background:none;border-radius:0;padding:8px 3px;font-size:11px;color:var(--muted);font-weight:700}.tab.active{color:var(--green);background:#f0f6f2}.ico{display:block;font-size:21px;margin-bottom:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}.chart{height:280px;display:flex;align-items:end;gap:10px;padding:20px 8px 8px}.bar{flex:1;background:#a9cbb8;border-radius:10px 10px 3px 3px;min-width:15px}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#a9cbb8;margin-right:5px}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fbfcfb;color:var(--ink);font-size:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.quote{font-size:13px;color:var(--muted);line-height:1.6}.tem{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{font-size:11px;font-weight:800;padding:6px 9px;border-radius:999px}.paid{background:#fae4e4;color:var(--red)}.pending{background:#e4f3e9;color:var(--green)}
.progress{height:18px;background:#f0dddd;border-radius:99px;overflow:hidden}.progress > div{height:100%;background:#77b08e}.milestones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.mile{padding:12px;background:#f8faf8;border-radius:12px;text-align:center;font-size:12px}.mile b{display:block;margin-top:4px}
.warning-box{margin:14px 0 2px;padding:14px 16px;border:2px solid #d76565;background:#fff2f2;border-radius:16px;color:#9f2f2f;font-weight:900;text-align:center;line-height:1.45;letter-spacing:.2px;animation:warnPulse 1.15s infinite}.warning-title{display:block;font-size:12px;letter-spacing:1.2px;margin-bottom:5px}.warning-text{font-size:13px}.install-card{display:none;align-items:center;justify-content:space-between;gap:12px;background:#edf6f0;border:1px solid #cfe3d6;border-radius:16px;padding:12px 14px;margin:0 16px 8px}.install-card.show{display:flex}.install-card .small{line-height:1.4}@keyframes warnPulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(201,107,107,.15)}50%{opacity:.55;box-shadow:0 0 0 7px rgba(201,107,107,0)}}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}.stock{grid-template-columns:1.4fr 1fr 1fr}.stock .hideMob{display:none}.value{font-size:18px}.title{font-size:22px}.tab{font-size:9px}.ico{font-size:19px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="title">BIST Portföy</div><div class="sub">Gecikmeli piyasa takibi · Demo veri</div></div><button class="refresh" onclick="refresh()">↻</button></header>
<div id="installCard" class="install-card"><div><b>Telefona uygulama olarak ekle</b><div class="small">Ana ekrandan tam ekran açmak için yükleyebilirsin.</div></div><button id="installBtn">YÜKLE</button></div>
<main id="content"></main>
<nav class="tabs">
<button class="tab active" onclick="show('portfolio',this)"><span class="ico">⌂</span>PORTFÖY</button>
<button class="tab" onclick="show('distribution',this)"><span class="ico">◔</span>DAĞILIM</button>
<button class="tab" onclick="show('dividend',this)"><span class="ico">💵</span>TEMETTÜ</button>
<button class="tab" onclick="show('target',this)"><span class="ico">🎯</span>HEDEF</button>
<button class="tab" onclick="show('history',this)"><span class="ico">▣</span>GEÇMİŞ</button>
<button class="tab" onclick="show('settings',this)"><span class="ico">⚙</span>AYARLAR</button>
</nav>
</div>
<script>
const fmt=n=>new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n);
const stocks=[
{code:'TUPRS',name:'Tüpraş',qty:120,cost:145.20,price:162.40},
{code:'THYAO',name:'Türk Hava Yolları',qty:80,cost:268.50,price:291.20},
{code:'ASELS',name:'Aselsan',qty:150,cost:78.40,price:92.10},
{code:'BIMAS',name:'BİM Birleşik Mağazalar',qty:60,cost:490.00,price:535.00},
{code:'EREGL',name:'Ereğli Demir Çelik',qty:200,cost:54.30,price:57.80},
{code:'SISE',name:'Şişecam',qty:180,cost:42.10,price:39.80},
{code:'FROTO',name:'Ford Otosan',qty:25,cost:1020,price:1088},
{code:'KCHOL',name:'Koç Holding',qty:75,cost:176.50,price:184.20},
{code:'SAHOL',name:'Sabancı Holding',qty:100,cost:91.20,price:96.80},
{code:'YKBNK',name:'Yapı Kredi',qty:300,cost:31.80,price:34.10}
];
let target=60000;
function totals(){let cost=stocks.reduce((s,x)=>s+x.qty*x.cost,0), val=stocks.reduce((s,x)=>s+x.qty*x.price,0);return {cost,val,pnl:val-cost,daily:val*0.006};}
function portfolio(){let t=totals();return `<div class="page"><div class="cards">
<div class="card"><div class="label">TOPLAM PORTFÖY DEĞERİ</div><div class="value">${fmt(t.val)} ₺</div></div>
<div class="card"><div class="label">KÂR / ZARAR</div><div class="value ${t.pnl>=0?'green':'red'}">${t.pnl>=0?'+':''}${fmt(t.pnl)} ₺</div></div>
<div class="card"><div class="label">MALİYET TUTARI</div><div class="value">${fmt(t.cost)} ₺</div></div>
<div class="card"><div class="label">GÜNLÜK KÂR / ZARAR</div><div class="value ${t.daily>=0?'green':'red'}">${t.daily>=0?'+':''}${fmt(t.daily)} ₺</div></div>
</div><div class="section">Portföyüm</div><div class="stocks">${stocks.map(x=>{let c=x.qty*x.cost,v=x.qty*x.price,p=v-c;return `<div class="panel stock"><div><div class="ticker">${x.code}</div><div class="company">${x.name}</div><div class="small">Adet: ${fmt(x.qty)} · Maliyet: ${fmt(c)} ₺</div></div><div><div class="small">1 HİSSE</div><b>${fmt(x.price)} ₺</b></div><div class="right hideMob"><div class="small">GÜNCEL DEĞER</div><b>${fmt(v)} ₺</b></div><div class="right"><div class="small">KÂR / ZARAR</div><b class="${p>=0?'green':'red'}">${p>=0?'+':''}${fmt(p)} ₺</b></div></div>`}).join('')}</div></div>`}
function distribution(){let t=totals();return `<div class="page"><div class="section">Portföy Dağılımı</div><div class="panel"><div class="chart">${stocks.map(x=>{let v=x.qty*x.price,p=v/t.val*100;return `<div class="bar" title="${x.code}: ${p.toFixed(1)}%" style="height:${Math.max(8,p*2.2)}%"></div>`}).join('')}</div><div class="legend">${stocks.map(x=>{let p=x.qty*x.price/t.val*100;return `<span><i class="dot"></i>${x.code} ${p.toFixed(1)}%</span>`}).join('')}</div></div></div>`}
const divs=[['TUPRS',2.90,120,'Ödendi'],['THYAO',1.50,80,'Bekleyen'],['ASELS',0.85,150,'Bekleyen'],['BIMAS',3.20,60,'Ödendi'],['EREGL',0.75,200,'Bekleyen'],['SISE',0.60,180,'Ödendi']];
function dividend(){let paid=0,forecast=0;divs.forEach(d=>{let n=d[1]*.85*d[2];forecast+=n;if(d[3]=='Ödendi')paid+=n});let monthly=Number(localStorage.monthly||3000),pct=Math.min(100,forecast/12/monthly*100);return `<div class="page"><div class="cards"><div class="card"><div class="label">YIL İÇİ NET ÖNGÖRÜ</div><div class="value">${fmt(forecast)} ₺</div></div><div class="card"><div class="label">ÖDENEN NET</div><div class="value">${fmt(paid)} ₺</div></div><div class="card"><div class="label">HEDEFLENEN AYLIK TEMETTÜ</div><div class="value">${fmt(monthly)} ₺</div></div><div class="card"><div class="label">AYLIK HEDEF ORANI</div><div class="value ${pct>=100?'green':'red'}">%${fmt(pct)}</div></div></div><div class="section">Net Temettü Geliri · 2026</div><div class="stocks">${divs.map(d=>{let gross=d[1]*d[2],net=gross*.85;return `<div class="panel tem"><div><b>${d[0]}</b><div class="small">${d[3]=='Ödendi'?'Ödenen':'Ödenecek'} brüt: ${fmt(gross)} ₺</div><div><b>${fmt(net/d[2])} ₺</b> <span class="small">hisse başına net</span></div></div><div class="right"><span class="badge ${d[3]=='Ödendi'?'paid':'pending'}">${d[3]}</span><div class="value ${d[3]=='Ödendi'?'red':'green'}">${fmt(net)} ₺</div></div></div>`}).join('')}</div></div>`}
function targetPage(){let t=totals(), monthly=Number(localStorage.monthly||3000),annual=target,ratio=Math.min(1, t.val?divs.reduce((s,d)=>s+d[1]*.85*d[2],0)/annual:0),remaining=Math.max(0,annual-divs.reduce((s,d)=>s+d[1]*.85*d[2],0));return `<div class="page"><div style="text-align:center"><div class="section" style="color:var(--red);font-size:21px">NET TEMETTÜ HEDEFİ</div><b>HEDEFE GİDEN YOLDA ÇEKİLEN BÜTÜN ÇİLELER KUTSALDIR</b></div><div class="warning-box"><span class="warning-title">UYARI</span><div class="warning-text">BU HESAPLAMALAR SADECE BU SENEYE GÖRE YAPILMIŞTIR. SENEYE HİSSESİNİN TEMETTÜ VERMESİ GARANTİ DEĞİLDİR. SADECE FİKİR AMAÇLIDIR</div></div><div class="panel"><div class="label">YILLIK NET TEMETTÜ HEDEFİ</div><input type="number" value="${annual}" onchange="target=Number(this.value)||0;show('target')"><div class="small" style="margin-top:10px">Öngörülen net temettü: <b>${fmt(divs.reduce((s,d)=>s+d[1]*.85*d[2],0))} ₺</b></div></div><div class="panel"><div class="label">HEDEFE İLERLEME</div><div class="progress"><div style="width:${ratio*100}%"></div></div><div class="milestones">${[.25,.5,.75,1].map(x=>`<div class="mile">${x*100}%<b>${fmt(annual*x)} ₺</b></div>`).join('')}</div></div><div class="panel"><b>HEDEF KADEMESİNE KALAN TUTAR</b><div class="value">${fmt(remaining)} ₺</div><div class="section">Nasıl ilerlemek istersiniz?</div><div class="btnrow"><button onclick="alert('Tek hisse planı: en düşük maliyetli ve net temettü verimi yüksek hisseler önce sıralanır.')">TEK HİSSE</button><button onclick="alert('Eşit dağılım planı: kalan hedef için hisselere güncel fiyatlarına göre dağıtım hesaplanır.')">EŞİT DAĞILIM</button></div></div></div>`}
function history(){let vals=[46800,47950,47120,48600,49350,50120,50780,51850,52600,totals().val];return `<div class="page"><div class="section">Geçmiş Portföy Değeri</div><div class="panel"><div class="chart">${vals.map((v,i)=>`<div class="bar" style="height:${v/Math.max(...vals)*85}% " title="${fmt(v)} ₺"></div>`).join('')}</div><div class="small">Günlük kayıtlar · saat gösterilmez</div></div><div class="stocks" style="margin-top:12px">${vals.map((v,i)=>`<div class="panel" style="display:flex;justify-content:space-between"><b>${new Date(Date.now()-(vals.length-1-i)*86400000).toLocaleDateString('tr-TR')}</b><b>${fmt(v)} ₺</b></div>`).join('')}</div></div>`}
function settings(){return `<div class="page"><div class="section">Ayarlar</div><div class="panel"><div class="section" style="margin-top:0">Temettü ve hedef</div><label class="small">Aylık net temettü hedefi</label><input type="number" value="${localStorage.monthly||3000}" onchange="localStorage.monthly=this.value"><div class="btnrow"><button onclick="location.reload()">Kaydet</button><button onclick="localStorage.clear();location.reload()">Verileri Sıfırla</button></div></div><div class="panel"><div class="section" style="margin-top:0">Mağaza hazırlığı</div><div class="quote">Android için AAB, güncel hedef API, gizlilik politikası, Veri Güvenliği formu, yaş derecelendirmesi, hesap silme, 512×512 ikon, 1024×500 özellik görseli ve ekran görüntüleri final sürümde hazırlanmalıdır.</div></div><div class="panel"><div class="section" style="margin-top:0">Veri kaynağı</div><div class="quote">Bu demo gerçek zamanlı veri çekmez. Üretim sürümünde gecikmeli BIST fiyatları ve güvenilir temettü kaynağı sunucu üzerinden bağlanmalıdır.</div></div></div>`}
function show(name,el){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');let c=document.getElementById('content');c.innerHTML={portfolio,distribution,dividend,target:targetPage,history,settings}[name]();}
function refresh(){show('portfolio',document.querySelector('.tab'))}
show('portfolio',document.querySelector('.tab'));
if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
let deferredPrompt=null; const installCard=document.getElementById('installCard'); const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installCard.classList.add('show')});
installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installCard.classList.remove('show')});
window.addEventListener('appinstalled',()=>installCard.classList.remove('show'));
</script>
</body></html>
